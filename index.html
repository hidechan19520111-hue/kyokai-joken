    <script type="module" crossorigin>(function(){const e=document.createElement("link").relList;if(e&&e.supports&&e.supports("modulepreload"))return;for(const s of document.querySelectorAll('link[rel="modulepreload"]'))n(s);new MutationObserver(s=>{for(const o of s)if(o.type==="childList")for(const l of o.addedNodes)l.tagName==="LINK"&&l.rel==="modulepreload"&&n(l)}).observe(document,{childList:!0,subtree:!0});function a(s){const o={};return s.integrity&&(o.integrity=s.integrity),s.referrerPolicy&&(o.referrerPolicy=s.referrerPolicy),s.crossOrigin==="use-credentials"?o.credentials="include":s.crossOrigin==="anonymous"?o.credentials="omit":o.credentials="same-origin",o}function n(s){if(s.ep)return;s.ep=!0;const o=a(s);fetch(s.href,o)}})();const N=36,zt=4,Dt=55,i=t=>({who:"narr",text:t}),p=t=>({who:"mio",text:t}),c=t=>({who:"them",text:t}),E=(t,e)=>({who:"them",text:e,name:t}),Z="安全率",Gt="境界条件　第一巻",Kt="https://kakuyomu.jp/works/2912051608050935735",g={takanashi:{id:"takanashi",name:"高梨",role:"設計主幹付き・若手解析担当",place:"設計棟 解析デスク",guard:45,intro:[i("高梨は、澪がデスクに近づくと、明らかに肩をこわばらせた。"),p("詳細サブモデルの件で、少し聞きたいことがある"),c("……はい")],comfort:{label:"責めに来たのではないと伝える",lines:[p("責めに来たわけじゃない。確かめたいことがあるだけだ"),i("高梨の肩から、少しだけ力が抜けた。")],guard:-25},wait:[[i("高梨は、キーボードの上で止めた指を、動かせずにいる。澪は、何も言わずに待った。")],[i("澪は応力図を机に置いたまま、黙っていた。高梨が、小さく息を吐いた。")]],cutoff:[c("……すみません。今日は、もう、勘弁してください"),i("高梨は席を立った。しばらくは、話を聞けそうにない。")]},uragami:{id:"uragami",name:"浦上",role:"試験棟・設備管理技官",place:"試験棟 設備管理室",guard:20,intro:[i("試験棟の設備を三十年近く預かってきた技官は、管理簿のファイルを抱えて現れた。"),c("硯川さん、また試験片保管庫ですか")],comfort:{label:"仕組みの話だと伝える",lines:[p("浦上さんを疑って聞いているんじゃありません。仕組みを、確かめたいんです"),i("浦上は、管理簿に置いた手を、少しだけ緩めた。")],guard:-20},wait:[[i("浦上は、管理簿に目を落としたまま、しばらく動かなかった。澪は、待った。")],[i("試験機の油圧ポンプの音だけが、低く続いている。浦上が、ファイルを閉じ直した。")]],cutoff:[c("硯川さん。今日は、ここまでにしてください。点検の時間なので"),i("浦上は設備室の奥へ戻っていった。しばらくは、話を聞けそうにない。")]},kiryu:{id:"kiryu",name:"桐生",role:"開発本部長",place:"本館 開発本部長室",guard:50,intro:[i("開発本部長室。桐生は、書類から目を上げなかった。"),c("調査委員会の件なら、申告は済ませてある。手短にしてくれ")],wait:[[i("桐生は、窓の外を見たまま、ペンの頭を机に打ちつけている。澪は、黙って立っていた。")],[i("沈黙が続いた。桐生が、椅子の上で、わずかに座り直した。")]],cutoff:[c("もういい。こちらも暇じゃないんだ。出直してくれ"),i("秘書が扉を開けた。しばらくは、面会を取り次いでもらえそうにない。")]}},wt=["takanashi","uragami","kiryu"],lt=[{id:"h_when",person:"takanashi",tag:"解析の経緯",q:"あの解析、いつ、誰の指示で回した?",lines:[c("半年ほど前です。桐生さんの方針で、第二荷重ケースの境界条件が見直されたんです"),c("ボルト孔クリアランスを、公差上限側——一番厳しく見た保守的な条件——から、公称値に置き換える変更でした。ただ、その公称値を、実機の組立状態で裏づける計測はしていませんでした")],statement:{id:"h_when",person:"takanashi",tag:"解析の経緯",text:"半年前、桐生さんの方針で境界条件が見直された。公差上限側から公称値へ。実機での計測はしていない。"},guard:3,sets:["h_when"],again:"半年前です。桐生さんの方針で、公称値に置き換えました。"},{id:"h_result",person:"takanashi",tag:"解析の結果",q:"結果は?",needs:["h_when"],lines:[c("起点になった、あのボルト孔の内側で、応力集中が、それまでの計算よりはっきり大きく出ました"),c("穴の縁に力が集まるのは、紙に小さな穴を開けると、その縁から先に破れやすくなるのと同じ理屈です。全体としては楽になったはずなのに、その一箇所だけ、逆に厳しくなっていたんです")],statement:{id:"h_result",person:"takanashi",tag:"解析の結果",text:"詳細サブモデルでは、起点になったボルト孔の内側で、応力集中がはっきり大きく出た。"},guard:3,sets:["h_result"],again:"あのボルト孔の内側です。あそこだけ、厳しくなっていました。"},{id:"h_report",person:"takanashi",tag:"報告先",q:"それを、誰に報告した?",needs:["h_result"],lines:[c("設計主幹と……月次の設計レビュー会議で、資料として提出しています"),p("会議には、誰が出席していた?"),i("高梨は、視線を泳がせた。"),c("設計主幹、品証部門から都築さん、それと……開発本部長の桐生さんも、途中から同席されていました"),i("高梨は、当時のレビュー資料と配布先の一覧を、澪に送った。")],statement:{id:"h_report",person:"takanashi",tag:"報告先",text:"結果は月次の設計レビュー会議に出した。設計主幹、都築さん、途中から桐生さんも同席していた。"},guard:5,sets:["h_report"],gives:["r_dist"],again:"設計レビュー会議です。資料は、お送りした通りです。"},{id:"h_meeting",person:"takanashi",tag:"あの会議",q:"その会議で、何があった?",needs:["h_report"],guardLimit:40,deflect:[c("あの会議のことは、あまり、思い出したくないんです"),i("高梨は、目を逸らしたまま、口を閉じた。いまは、これ以上話してくれそうにない。")],lines:[c("僕、あのとき、応力集中が思ったより大きいって、指摘したんです。都築さんも、その場で『公称値の妥当性は、実測で確認すべきだ』とおっしゃって、オープンアイテムとして議事録に残ることになりました"),c("でも翌週、設計側から『適用規格の許容範囲内であり、追加検証は不要』という回答書が出て、設計主幹の承認で、クローズされました。都築さんは最後まで食い下がっていたんですが、品証には、設計を差し戻す権限までは、ないので"),c("あの部品が壊れたって聞いたとき、真っ先に、あの会議のことを思い出しました。僕が、もっと強く言っていたら——"),p("お前のせいじゃない。それは、組織の側の問題だ")],statement:{id:"h_meeting",person:"takanashi",tag:"あの会議",text:"都築さんが「実測で確認すべきだ」と言い、オープンアイテムになった。翌週、回答書と設計主幹の承認でクローズされた。"},guard:-10,sets:["h_meeting"],again:"……議事録に、残っているはずです。"},{id:"h_skill",person:"takanashi",tag:"加工と試験",q:"放電加工や、疲労試験機の扱いは",lines:[c("僕には、無理です。解析はできますが、加工や試験の実務は、専門外です。触ったこともありません"),i("嘘は感じられなかった。だが、感じられない、というだけでは足りない。")],statement:{id:"h_skill",person:"takanashi",tag:"加工と試験",text:"放電加工や疲労試験機は専門外。触ったこともない。"},guard:8,sets:["h_skill"],again:"触ったことも、ありません。本当です。"},{id:"u_log",person:"uragami",tag:"設備の使用記録",q:"放電加工機と油圧疲労試験機。半年前から破断までの使用記録を、見せてもらえますか",lines:[c("予約は、試験依頼番号と依頼部署の名前で管理されています。個人名は残りません。制御盤にも、操作した人間までは紐づかない。資格者であれば、誰でも動かせます"),c("……ありますね。境界条件の見直しがあった直後から二ヶ月ほどの間に、時間外の予約が何回か。依頼部署は、品証部門です"),i("浦上は、管理簿の該当ページを写して、澪に渡した。")],statement:{id:"u_log",person:"uragami",tag:"設備の使用記録",text:"予約に残るのは個人名ではなく、試験依頼番号と依頼部署。時間外の予約は品証部門の名義だった。"},guard:5,sets:["u_log"],gives:["r_booking"],again:"管理簿に書いてある通りです。依頼部署は、品証部門。"},{id:"u_who",person:"uragami",tag:"来ていた人",q:"誰が実際に来ていたか、ご存じですよね。時間外の承認を出したのは、浦上さんです",needs:["u_log"],lines:[c("……硯川さん。僕の口から名前を出すのは、勘弁してください。僕が言えば、それは僕の印象です。記録なら、事実です"),c("一つだけ、言えることがあります。装置の扱いに、慣れた人でした。放電加工機も、疲労試験機も、両方です。最初の何回かは、同じ材料の端材で、条件出しをされていました")],statement:{id:"u_who",person:"uragami",tag:"来ていた人",text:"来ていたのは、放電加工機も疲労試験機も扱い慣れた人。最初の何回かは、同じ材料の端材で条件出しをしていた。"},guard:18,sets:["u_who"],again:"名前は、記録に聞いてください。入退室は、個人カードで残っています。"},{id:"u_self",person:"uragami",tag:"浦上自身",q:"浦上さんご自身は、疲労き裂を、狙った位置まで進展させることはできますか",needs:["u_log"],lines:[i("浦上は、笑わなかった。疑われていることを、分かっている顔だった。"),c("決められた条件で装置を動かすことはできます。でも、どこに起点を作って、どの方向にき裂を進めれば、狙った荷重で壊れるか——そこまでになると、僕の専門じゃありません")],statement:{id:"u_self",person:"uragami",tag:"浦上自身",text:"装置は動かせる。だが、どこに起点を作り、どの方向に進めれば狙った荷重で壊れるかは、専門ではない。"},guard:12,sets:["u_self"],again:"装置は動かせます。狙って壊す設計は、できません。"},{id:"u_recheck",person:"uragami",tag:"ラグの再検査",q:"あのラグは、組立の直前に、品証の再検査に回されていましたよね",lines:[c("三日間ですね。品証部門の管理下にあったのは"),c("受入の非破壊検査は、その前に、もう正式に合格しています。この再検査は寸法と実測相関の確認で、非破壊検査をやり直す工程には、なっていません"),i("検査と検査の、隙間の三日間。ラグは、その直後にブッシュを圧入され、起点は二度と見えなくなった。")],statement:{id:"u_recheck",person:"uragami",tag:"ラグの再検査",text:"ラグが品証の管理下にあったのは三日間。受入の非破壊検査は、その前に合格済みだった。"},guard:3,sets:["u_recheck"],gives:["r_recheck"],again:"三日間です。台帳の写しは、お渡ししました。"},{id:"u_key",person:"uragami",tag:"桐生の夜",q:"芦田さんが亡くなった夜、桐生さんは資料保管室にいたそうです。夜、あの部屋に行かれることは、よくあるんですか",lines:[c("資料保管室の鍵を、借りられています。貸出簿は、毎朝、僕が確認するんです。深夜の貸出は、あの晩が初めてでした"),c("鍵は開発本部長と、品証の一部の役職者しか持っていません。桐生さんが入るのは、規則上、何の問題もありません")],statement:{id:"u_key",person:"uragami",tag:"桐生の夜",text:"あの晩、桐生さんが資料保管室の鍵を借りている。深夜の貸出は初めてだった。"},guard:3,sets:["u_key"],gives:["r_key"],again:"深夜の貸出は、あの晩だけです。"},{id:"u_store",person:"uragami",tag:"保管庫の記録",q:"あの夜、階段と試験片保管庫、両方の入退記録は残っていますか",lines:[c("残ってますよ。保管庫には、独自のカードキーの記録が自動で残ります"),c("ただ、階段の踊り場だけは、もともとカメラの死角なんです。昔からの構造上、どうしても映らない")],statement:{id:"u_store",person:"uragami",tag:"保管庫の記録",text:"試験片保管庫には独自のカードキー記録が残る。階段の踊り場は、昔からカメラの死角。"},guard:5,sets:["u_store"],again:"保管庫の記録は、開示を取れば出ます。踊り場は、映りません。"},{id:"k_night",person:"kiryu",tag:"あの夜",q:"あの夜、資料保管室で、何をされていたんですか",lines:[c("申告した通りだ。過去の決裁文書を、確認していた。それだけだ")],statement:{id:"k_night",person:"kiryu",tag:"あの夜",text:"あの夜は、資料保管室で過去の決裁文書を確認していた。それだけだ。"},guard:10,sets:["k_night"],again:"同じことを、何度言わせる。確認していただけだ。"},{id:"k_policy",person:"kiryu",tag:"半年前の決裁",q:"半年前の、境界条件の見直しについて伺います",lines:[c("規格値の範囲内なら、今から設計を戻す理由はない。あのとき、そう言った。今も変わらん"),c("オープンアイテムは、回答書と設計主幹の承認で、正式にクローズしている。手続きに、欠けたところはない")],statement:{id:"k_policy",person:"kiryu",tag:"半年前の決裁",text:"規格値の範囲内なら設計を戻す理由はない。オープンアイテムは正式にクローズしている。"},guard:10,sets:["k_policy"],again:"正式にクローズした話だ。蒸し返すな。"},{id:"k_ashida",person:"kiryu",tag:"芦田のこと",q:"芦田くんのことは",needs:["k_confess"],lines:[c("知らない。本当に、知らない。あの夜、俺が試験棟にいた時間は、記録を見れば分かるはずだ")],statement:{id:"k_ashida",person:"kiryu",tag:"芦田のこと",text:"芦田くんのことは知らない。あの夜、試験棟にいた時間は、記録を見れば分かる。"},guard:5,sets:["k_ashida"],again:"知らないと言っている。記録を見ろ。"}],D=[{id:"r_fracture",no:"01",name:"破面の比較観察所見",from:"材料班 SEM観察",kind:"start",cost:0,rows:[{k:"起点直下",v:"再凝固層と熱影響部。放電加工の比較片とよく一致"},{k:"起点の位置",v:"ボルト孔の内側。組立後はブッシュに隠れて見えない"},{k:"き裂面の向き",v:"詳細サブモデルの最大引張主応力に、ほぼ直交"},{k:"残留強度解析",v:"終極荷重の62%と符合"},{k:"縞の間隔",v:"狭・中・広の三つが、規則的に入れ替わる"}],memo:"事故ではない。誰かが、見えない場所を、見える者だけが知る方向で、狙って壊した。"},{id:"r_ashida",no:"02",name:"芦田の比較画像と、最後の言葉",from:"芦田陸のUSBメモリ",kind:"start",cost:0,rows:[{k:"画像",v:"ボルト孔内側の解析図と、破面の起点を重ねた一枚"},{k:"木曜の夕方",v:"「このラグ、組立直前に一度だけ、品証の再検査に回されてます」"},{k:"地下へ降りる前",v:"「十分で終わります」"}],memo:"芦田は、その先を確かめようとしていた夜に、命を落とした。"},{id:"r_entry",no:"03",name:"試験棟地下の入館記録",from:"事故調査委員会 開示",kind:"start",cost:0,rows:[{k:"対象",v:"あの夜、23時から午前3時まで"},{k:"入館者",v:"四名"},{k:"一",v:"警備員(巡回記録と一致)"},{k:"二",v:"芦田 陸"},{k:"三",v:"桐生 忠嗣(開発本部長)"},{k:"四",v:"都築 太一(品質保証部門担当役員)"}],memo:"記録は、嘘をついていない。だとすれば——嘘をついているのは、人間の方だ。"},{id:"r_memo",no:"04",name:"委員会議事メモ(当夜の申告)",from:"事故調査委員会",kind:"start",cost:0,rows:[{k:"都築の申告",v:"証拠保全状況の確認のため入館。試験片保管庫にも立ち入ったが、室内に人はおらず、芦田とは会っていない"},{k:"桐生の申告",v:"過去の決裁文書の確認のため、資料保管室に立ち入り。零時過ぎに退館。芦田とは会っていない"},{k:"所見",v:"特段の不審点は認められず"}],memo:"安堵していいはずだった。だが、安堵しきれない。"},{id:"r_dist",no:"05",name:"半年前のレビュー資料と配布先",from:"高梨",kind:"given",cost:0,rows:[{k:"資料",v:"第二荷重ケース 詳細サブモデルの解析結果(孔内側の応力集中の位置と方向)"},{k:"出席者",v:"設計主幹、高梨、都築(品証)、桐生(途中から)"},{k:"配布先",v:"設計、解析、品証、開発本部"},{k:"含まれない",v:"試験設備の担当部署"}],memo:"応力の向きは、高梨ひとりの秘密ではなかった。あの会議室にいた者は、知り得た。"},{id:"r_minutes",no:"06",name:"設計レビュー議事録(オープンアイテム)",from:"事故調査委員会 開示",kind:"request",needs:["h_meeting"],cost:1,rows:[{k:"起票",v:"都築太一「公称値の妥当性は、実測で確認すべき」"},{k:"都築の発言",v:"「公称値で成立することと、公差域全体で成立することは、別だ」"},{k:"翌週",v:"技術回答書「適用規格の許容範囲内であり、追加検証は不要」"},{k:"結果",v:"設計主幹の承認によりクローズ。実測データの裏付けなし"}],memo:"都築は、使える正規の手続きを、一つずつ使った。それでも、止められなかった。"},{id:"r_booking",no:"07",name:"設備予約の管理簿",from:"浦上",kind:"given",cost:0,rows:[{k:"時期",v:"境界条件見直しの直後から、約二ヶ月"},{k:"内容",v:"時間外の予約が数回(事前承認済み)"},{k:"依頼部署",v:"品質保証部門"},{k:"理由",v:"「境界条件見直しに伴う、実測での確認試験」"},{k:"操作者",v:"記録なし(制御盤は個人に紐づかない)"}],memo:"手続きは、どこも欠けていない。そのことが、かえって薄ら寒い。"},{id:"r_recheck",no:"08",name:"再検査の台帳",from:"浦上",kind:"given",cost:0,rows:[{k:"対象",v:"主翼取付ラグ(破断品)"},{k:"品証の管理下",v:"組立直前の三日間"},{k:"受入の非破壊検査",v:"浸透探傷・渦流探傷とも、再検査より前に合格済み"},{k:"再検査の内容",v:"寸法と実測相関の確認のみ"}],memo:"誰かは、検査を無効にしたのではない。検査と検査の、隙間を使った。"},{id:"r_key",no:"09",name:"資料保管室の鍵貸出簿",from:"浦上",kind:"given",cost:0,rows:[{k:"23:21",v:"桐生忠嗣 借出"},{k:"0:08",v:"桐生忠嗣 "都築 太一 入室"},{k:"退室",v:"記録なし(入室側だけを管理する仕組み)"},{k:"保全写真",v:"閲覧机に、現品移動票の綴りが開かれたまま"},{k:"その後",v:"芦田の発見まで、他の入室者なし"}],memo:"六分。芦田は、十分かかる作業を、六分で切り上げる人間ではなかった。"}],dt=[{statement:"h_result",record:"r_fracture",result:"match",lines:[i("き裂面の向きは、高梨の詳細サブモデルでしか現れない最大引張主応力に、ほぼ直交している。"),i("証言と破面は、同じことを言っていた。この一点を狙った人間は、この解析の結果を知っていた。")],note:"犯行には、この解析結果の知識が要る。",sets:["c_knowledge"]},{statement:"h_skill",record:"r_cert",result:"match",lines:[i("照会の回答に、設計・解析部門の該当者はいない。高梨の名前は、どこにもなかった。"),c("……信じて、もらえるんですか"),p("信じたんじゃない。確かめたんだ")],note:"高梨には、手段がない。",sets:["clear_takanashi"]},{statement:"u_self",record:"r_dist",result:"match",lines:[i("配布先は、設計、解析、品証、開発本部。試験設備の担当は入っていない。出席者にも、浦上の名前はなかった。"),i("孔の内側の、どの向きに、という話は、あの資料を読まなければ出てこない。")],note:"浦上には、知識が届いていない。",sets:["clear_uragami"]},{statement:"u_who",record:"r_room",result:"match",lines:[i("時間外の入室は五回。はじめの三回には、同じ材料の端材が払い出されている。浦上の言った、条件出しだった。"),c("……記録が、答えましたか")],note:"来ていたのは、端材で条件を出せる人間だった。",sets:["c_trial"]},{statement:"k_night",record:"r_follow",result:"mismatch",lines:[p("これは、いつ差し込まれたものですか"),i("桐生の顔から、初めて、完全に表情が消えた。"),c("……あの夜だ。事故調査があの決裁まで遡ったら、実測の裏付けもなく俺が押し通したことが、明らかになる。だから、なかったはずの試験を確認済みだと書いた紙を、自分で作って、ファイルに挟んだ"),c("だが、俺がやったのは、それだけだ。あの部材に何かを仕込むことなんて、俺にはできない。技術のことは、俺には分からない")],note:"桐生は、文書の差し込みを認めた。",sets:["k_confess"]},{statement:"k_ashida",record:"r_patrol",result:"match",lines:[i("二十三時十七分に入館。零時十二分に退館。零時二十分の巡回で、踊り場には、まだ誰も倒れていなかった。"),i("桐生の罪は、確かにあった。だが、それは、澪が追っていた罪ではなかった。")],note:"あの踊り場で起きたことに、桐生は関われない。",sets:["clear_kiryu"]}],Vt={takanashi:[i("記録と証言を並べてみる。同じとも、違うとも、言えなかった。"),c("……それが、何か")],uragami:[i("記録と証言を並べてみる。同じとも、違うとも、言えなかった。"),c("その記録は、別の話だと思いますよ")],kiryu:[i("記録と証言を並べてみる。同じとも、違うとも、言えなかった。"),c("それが、どうした。時間の無駄だ")]},Wt="同じことを二度聞かれて、相手の表情が硬くなった。",V=[{id:"test",img:"st-test",chapter:"第1章",title:"六十二パーセント",lines:[i("東雲重工、民間航空機事業部。国産旅客機SN100——社内で「つばさ計画」と呼ばれる開発の、最終段階。型式証明に向けた、主翼の静強度試験の日だった。"),i("硯川澪は、壁一面のモニターに並ぶ三十六本のひずみの折れ線から、目を離さなかった。"),E("試験主任","百五十パーセント——終極荷重、到達"),i("一秒。二秒。三秒。主翼は耐えた。モニタールームに、遠慮のない拍手が起きた。"),i("だが、試験はまだ終わりではなかった。非対称の荷重とねじりが強く入る、第二ケース。応力の予測が最も難しい条件だった。"),E("試験主任","六十。六十一。六十二——"),i("ドン。試験棟全体が震えた。ガラスの向こうで、主翼が、あり得ない角度に折れ曲がっていた。"),i("百五十パーセントに耐えた翼が、荷重の種類を変えただけで、終極荷重のわずか六十二パーセントで折れた。理屈が、通らなかった。")]},{id:"mentor",img:"st-mentor",chapter:"第2章",title:"託されたもの",lines:[i("こういうとき、誰に相談すればいいか。考えるまでもなかった。都築太一。かつての上司であり、師であり、澪がこの会社で最も信頼している技術者だった。"),i("五年前。防衛機器事業部の試験棟で、入社二年目の澪の探傷データを覗き込んで、都築は言った。"),E("都築","見つけたか"),E("都築","数字は嘘をつかない。嘘をつくのは、それを読む人間の都合だ。俺たちの仕事は、その都合に負けないことだ"),i("疑わしいときは、面倒でも最後まで追え。それも、都築の教えだった。"),i("民間機への異動を勧めたのも都築だった。最後の日、都築は澪に、白紙のノートを一冊渡した。あれから三年。最初のページは、まだ白いままだ。"),i("その都築は、いま、品質保証部門の担当役員になっている。")]},{id:"fracture",img:"st-fracture",chapter:"第3章",title:"破面",lines:[i("破断したのは、主翼と中央翼を結ぶ、厚肉の金属製取付ラグだった。澪は白手袋をはめ、ルーペを手に、その破面に顔を近づけた。"),i("大部分は、一気に引きちぎられたことを示す粗い模様。だが、起点の付近だけ、肌合いが違った。"),i("翌朝の会議で、入社三年目の芦田陸が、電子顕微鏡の画像を出した。起点のそばに、疲労き裂が進んだときにできる縞——ストライエーションが写っていた。"),i("新品の部材が、いきなり静強度試験に入ったのなら、そんなものは存在しないはずだった。"),E("桐生","材料ロットの検証は最優先で進めてくれ。設計側の見落としがあったかどうかは、その後で構わない"),i("開発本部長の桐生は、そう言い切った。計画の遅れは既に二年。これ以上の遅れは、経営会議での中止判断に直結する。"),p("数回の予備負荷でつく痕と、あの破面に残っている履歴。——それ、本当に同じですか")]},{id:"ashida",img:"st-ashida",chapter:"第5章",title:"十分で終わります",lines:[i("木曜の夕方、芦田がタブレットを手に、澪の机にやってきた。"),E("芦田","起点の位置、気になりませんか。ボルト孔の内側の縁です。ブッシュを圧入した後は、二度と、見えなくなります"),E("芦田","き裂面の向きも、詳細サブモデルでなければ現れない応力の方向と揃っています"),i("見えない場所を、見える者だけが知る方向で、狙って壊した——そう言っているのと、ほとんど同じだった。"),p("まだ、何も言うな。偶然の可能性を、まだ潰しきれていない"),i("その夜。翌日は、芦田の娘の四歳の誕生日だった。澪は、先に帰れと言った。"),E("芦田","その前に一つだけ。このラグ、組立直前に一度だけ、品証の再検査に回されてます。保管庫の現品移動票を見れば、理由が分かるはずです。十分で終わります"),i("芦田は、比較画像を入れたUSBメモリを澪の机に置き、保管庫のある地下へ降りていった。澪がその背中を見たのは、それが最後になった。")]},{id:"stairs",img:"st-stairs",chapter:"第5章",title:"事故",lines:[i("午前一時前、澪のスマートフォンが鳴った。試験棟の警備担当からだった。"),E("警備担当","硯川さん、夜分にすみません。芦田さんが……試験片保管庫前の階段で、倒れているのが見つかりました"),i("構内を走れば三分。地下の踊り場に、芦田は倒れていた。呼びかけても、反応はなかった。"),i("踊り場の照明が一つ、切れたままだった。暗い階段で足を滑らせた——当初は、そう考えられた。"),i("その夜遅く、搬送先の病院で、芦田の死亡が確認された。娘の誕生日は、その日の午後に、来るはずだった。"),i("何も言うな、とだけ言って突き放したのは、自分だった。")]},{id:"four",img:"st-log",chapter:"第7章",title:"四人の夜",lines:[i("葬儀のあと、澪は芦田のUSBを開いた。そして、破面をもう一度、最後まで追った。"),i("
